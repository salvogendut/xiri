# Copy beside netbsd-xiri.chd; this is Prismatic's schema, not iris.toml.
tinker = true
[audio]
muted = true
[machine]
profile = "indy_ip24"
cpu = "r4400"
ram_mb = 256
graphics = "newport"
[advanced]
scsi_deferred_interrupts = true
serial_logging = "raw"
[advanced.expert]
monitor_port = 8898
serial_port_a = 8890
serial_port_b = 8891
[media.devices.1]
kind = "disk"
path = "netbsd-xiri.chd"
