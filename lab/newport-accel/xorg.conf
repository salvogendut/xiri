# Serial remains the control console; allocate wsdisplay screen 0 before Xorg.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection

Section "ServerLayout"
    Identifier "Indy"
    Screen "NewportScreen"
    InputDevice "Keyboard" "CoreKeyboard"
    InputDevice "Mouse" "CorePointer"
EndSection

Section "InputDevice"
    Identifier "Keyboard"
    Driver "kbd"
    Option "Protocol" "wskbd"
    Option "Device" "/dev/wskbd"
EndSection

Section "InputDevice"
    Identifier "Mouse"
    Driver "mouse"
    Option "Protocol" "wsmouse"
    Option "Device" "/dev/wsmouse"
EndSection

Section "Device"
    Identifier "Newport"
    Driver "newport"
    # Experimental acceleration profile; compare with the qualified NoAccel image.
    Option "NoAccel" "false"
EndSection

Section "Monitor"
    Identifier "Monitor"
    HorizSync 30-82
    VertRefresh 50-76
EndSection

Section "Screen"
    Identifier "NewportScreen"
    Device "Newport"
    Monitor "Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x1024"
        Virtual 1280 1024
    EndSubSection
EndSection
