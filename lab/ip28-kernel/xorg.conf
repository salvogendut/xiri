# IMPACT owns a RAM shadow; serial remains the early/debug console.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection
Section "ServerLayout"
    Identifier "IP28"
    Screen "ImpactScreen"
    InputDevice "Keyboard" "CoreKeyboard"
    InputDevice "Mouse" "CorePointer"
EndSection
Section "InputDevice"
    Identifier "Keyboard"
    Driver "kbd"
    Option "Protocol" "wskbd"
    Option "Device" "/dev/wskbd"
EndSection
Section "InputDevice"
    Identifier "Mouse"
    Driver "mouse"
    Option "Protocol" "wsmouse"
    Option "Device" "/dev/wsmouse"
EndSection
Section "Device"
    Identifier "IMPACT"
    Driver "wsfb"
    Option "device" "/dev/ttyE0"
    Option "ShadowFB" "true"
EndSection
Section "Monitor"
    Identifier "FirmwareMode"
EndSection
Section "Screen"
    Identifier "ImpactScreen"
    Device "IMPACT"
    Monitor "FirmwareMode"
    DefaultDepth 24
EndSection
