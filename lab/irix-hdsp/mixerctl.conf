# Configuration for NetBSD /etc/rc.conf.d/mixerctl on an Indy.
mixerctl=YES
mixerctl_mixers=mixer0
xiri_initial_volume()
{
    if [ ! -s /var/db/mixer0.conf ] && [ ! -f /etc/mixerctl.conf ] &&
        [ "$(audioctl -n name 2>/dev/null)" = HAL2 ]; then
        /usr/bin/mixerctl -n -w outputs.master=64,64
    fi
    return 0
}
start_precmd=xiri_initial_volume
