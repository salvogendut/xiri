# Serial remains the control console; allocate wsdisplay screen 0 before Xorg.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection

Section "ServerLayout"
    Identifier "Indy"
    Screen "NewportScreen"
    InputDevice "Keyboard" "CoreKeyboard"
    InputDevice "Mouse" "CorePointer"
EndSection

Section "InputDevice"
    Identifier "Keyboard"
    Driver "kbd"
    Option "Protocol" "wskbd"
    Option "Device" "/dev/wskbd"
EndSection

Section "InputDevice"
    Identifier "Mouse"
    Driver "mouse"
    Option "Protocol" "wsmouse"
    Option "Device" "/dev/wsmouse"
EndSection

Section "Device"
    Identifier "Newport"
    Driver "newport"
    # XAA fast-clear colors currently fail the IRIS pixel probe.
    Option "NoAccel" "true"
EndSection

Section "Monitor"
    Identifier "Monitor"
EndSection

Section "Screen"
    Identifier "NewportScreen"
    Device "Newport"
    Monitor "Monitor"
    DefaultDepth 24
EndSection
